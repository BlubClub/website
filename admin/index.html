<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUB CLUB • Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #252525 0%, #0d0d0d 45%, #050505 100%);
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        .container {
            width: min(1150px, 92%);
            margin: 0 auto;
            padding: 50px 0;
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 28px;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #bbb;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #d4af37;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #d4af37;
            color: #111;
            font-size: 16px;
        }

        .login-button:hover {
            background: #f0cc55;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .admin-panel {
            display: none;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .welcome {
            color: #aaa;
            margin-top: 6px;
        }

        .logout {
            padding: 11px 18px;
            border-radius: 9px;
            background: #252525;
            color: white;
            border: 1px solid #444;
        }

        .logout:hover {
            background: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat {
            background: #151515;
            border: 1px solid #303030;
            border-radius: 15px;
            padding: 22px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #d4af37;
        }

        .stat-label {
            color: #999;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 22px;
            border-radius: 10px;
            background: #151515;
            border: 1px solid #333;
            color: #aaa;
        }

        .tab-button:hover {
            color: white;
            border-color: #555;
        }

        .tab-button.active {
            background: #d4af37;
            color: #111;
            border-color: #d4af37;
        }

        .tab {
            display: none;
        }

        .tab.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .section-header h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .add-button {
            padding: 12px 18px;
            border-radius: 9px;
            background: #d4af37;
            color: #111;
        }

        .add-button:hover {
            background: #f0cc55;
        }

        .visitor-list,
        .staff-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .visitor,
        .staff-member {
            background: #151515;
            border: 1px solid #303030;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .visitor-info,
        .staff-info {
            min-width: 0;
            flex: 1;
        }

        .visitor-name,
        .staff-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .staff-role {
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .staff-description {
            color: #999;
            font-size: 14px;
            line-height: 1.5;
        }

        .visitor-id {
            color: #777;
            font-size: 12px;
            word-break: break-all;
        }

        .joined {
            color: #888;
            font-size: 13px;
            margin-top: 7px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .banned {
            background: rgba(255, 70, 70, 0.15);
            color: #ff7070;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ban-button,
        .unban-button,
        .edit-button,
        .delete-button {
            padding: 11px 17px;
            border-radius: 9px;
            color: white;
        }

        .ban-button {
            background: #9b2525;
        }

        .ban-button:hover {
            background: #c52f2f;
        }

        .unban-button {
            background: #246b3a;
        }

        .unban-button:hover {
            background: #2f8b4d;
        }

        .edit-button {
            background: #555;
        }

        .edit-button:hover {
            background: #666;
        }

        .delete-button {
            background: #6d2020;
        }

        .delete-button:hover {
            background: #902828;
        }

        .loading,
        .empty {
            text-align: center;
            color: #888;
            padding: 50px;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 550px;
            background: #151515;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 80px rgba(0,0,0,.7);
        }

        .modal-box h2 {
            margin: 0 0 10px;
            letter-spacing: 1px;
        }

        .modal-subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            background: #d4af37;
            color: #111;
        }

        .cancel-button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            background: #292929;
            color: white;
        }

        .form-error {
            color: #ff7070;
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 30px 22px;
            }

            .title {
                font-size: 25px;
            }

            .visitor,
            .staff-member {
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="logo">🫧</div>

        <h1>BLUB CLUB</h1>

        <div class="subtitle">
            Administrator Access
        </div>

        <label for="adminName">Admin Name</label>

        <input
            id="adminName"
            type="text"
            placeholder="Enter admin name"
            autocomplete="off"
        >

        <label for="adminPassword">Password</label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="off"
        >

        <button class="login-button" id="loginButton">
            ENTER ADMIN PANEL
        </button>

        <div class="error" id="loginError"></div>
    </div>
</div>



<div class="admin-panel" id="adminPanel">

    <div class="container">

        <div class="topbar">
            <div>
                <div class="title">
                    BLUB CONTROL
                </div>

                <div class="welcome" id="welcomeText"></div>
            </div>

            <button class="logout" id="logoutButton">
                LOG OUT
            </button>
        </div>



        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="totalVisitors">0</div>
                <div class="stat-label">Total Visitors</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="bannedVisitors">0</div>
                <div class="stat-label">Banned</div>
            </div>

        </div>



        <div class="tabs">

            <button
                class="tab-button active"
                data-tab="visitorsTab"
            >
                VISITORS
            </button>

            <button
                class="tab-button"
                data-tab="staffTab"
            >
                STAFF
            </button>

        </div>



        <section
            id="visitorsTab"
            class="tab active"
        >

            <div class="section-header">
                <h2>BLUB VISITORS</h2>
            </div>

            <div
                id="visitorList"
                class="visitor-list"
            >
                <div class="loading">
                    Loading BLUB visitors...
                </div>
            </div>

        </section>



        <section
            id="staffTab"
            class="tab"
        >

            <div class="section-header">

                <h2>BLUB CLUB STAFF</h2>

                <button
                    class="add-button"
                    id="addStaffButton"
                >
                    + ADD STAFF
                </button>

            </div>

            <div
                id="staffList"
                class="staff-list"
            >
                <div class="loading">
                    Loading BLUB staff...
                </div>
            </div>

        </section>

    </div>
</div>



<div
    class="modal"
    id="staffModal"
>
    <div class="modal-box">

        <h2 id="staffModalTitle">
            ADD STAFF MEMBER
        </h2>

        <div class="modal-subtitle">
            This information will appear on the BLUB CLUB homepage.
        </div>

        <input
            type="hidden"
            id="staffId"
        >

        <label for="staffName">
            Name
        </label>

        <input
            id="staffName"
            type="text"
            maxlength="100"
            placeholder="Pravith"
        >

        <label for="staffRole">
            Role
        </label>

        <input
            id="staffRole"
            type="text"
            maxlength="100"
            placeholder="Manager"
        >

        <label for="staffDescription">
            Description
        </label>

        <textarea
            id="staffDescription"
            maxlength="500"
            placeholder="Optional staff description..."
        ></textarea>

        <label for="staffOrder">
            Display Order
        </label>

        <input
            id="staffOrder"
            type="number"
            value="1"
            min="0"
            step="1"
        >

        <div
            class="form-error"
            id="staffFormError"
        ></div>

        <div class="modal-actions">

            <button
                class="cancel-button"
                id="cancelStaffButton"
            >
                CANCEL
            </button>

            <button
                class="save-button"
                id="saveStaffButton"
            >
                SAVE STAFF
            </button>

        </div>

    </div>
</div>



<script>

const SUPABASE_URL =
    "https://mkygrpgdsncnenyywtyy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bI-GRwcfRztZYDeZiBBRNA_3Gmtzwbb";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



const loginScreen =
    document.getElementById("loginScreen");

const adminPanel =
    document.getElementById("adminPanel");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const adminNameInput =
    document.getElementById("adminName");

const adminPasswordInput =
    document.getElementById("adminPassword");

const loginError =
    document.getElementById("loginError");

const welcomeText =
    document.getElementById("welcomeText");

const visitorList =
    document.getElementById("visitorList");

const staffList =
    document.getElementById("staffList");

const staffModal =
    document.getElementById("staffModal");

const staffModalTitle =
    document.getElementById("staffModalTitle");

const staffId =
    document.getElementById("staffId");

const staffName =
    document.getElementById("staffName");

const staffRole =
    document.getElementById("staffRole");

const staffDescription =
    document.getElementById("staffDescription");

const staffOrder =
    document.getElementById("staffOrder");

const staffFormError =
    document.getElementById("staffFormError");

const addStaffButton =
    document.getElementById("addStaffButton");

const cancelStaffButton =
    document.getElementById("cancelStaffButton");

const saveStaffButton =
    document.getElementById("saveStaffButton");

// Credentials are kept only in memory while the admin panel is open.
let currentAdminName = null;
let currentAdminPassword = null;



/* ==========================================
   TABS
========================================== */

document
    .querySelectorAll(".tab-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".tab-button")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                document
                    .querySelectorAll(".tab")
                    .forEach(tab =>
                        tab.classList.remove("active")
                    );

                button.classList.add("active");

                document
                    .getElementById(
                        button.dataset.tab
                    )
                    .classList.add("active");

            }
        );

    });



/* ==========================================
   LOGIN
========================================== */

loginButton.addEventListener(
    "click",
    login
);

adminPasswordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            login();
        }

    }
);



async function login() {

    const name =
        adminNameInput.value.trim();

    const password =
        adminPasswordInput.value;

    loginError.textContent = "";

    if (!name || !password) {

        loginError.textContent =
            "Enter both your admin name and password.";

        return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
        "CHECKING...";

    try {
        const {
            data,
            error
        } =
            await supabaseClient
                .from("blub_admins")
                .select("name")
                .eq("name", name)
                .eq("password", password)
                .maybeSingle();

        if (error) {
            console.error(error);

            loginError.textContent =
                "Could not connect to BLUB security.";

            return;
        }

        if (!data) {
            loginError.textContent =
                "Invalid admin name or password.";

            return;
        }

        // Save credentials in memory for the ban RPC.
        currentAdminName = data.name;
        currentAdminPassword = password;

        adminNameInput.value = "";
        adminPasswordInput.value = "";

        loginScreen.style.display =
            "none";

        adminPanel.style.display =
            "block";

        welcomeText.textContent =
            "Logged in as " + data.name;

        await Promise.all([
            loadVisitors(),
            loadStaff()
        ]);

    } catch (error) {
        console.error(error);
        loginError.textContent =
            "Unexpected login error. Check the browser console.";
    } finally {
        loginButton.disabled = false;
        loginButton.textContent =
            "ENTER ADMIN PANEL";
    }
}



/* ==========================================
   VISITORS
========================================== */

async function loadVisitors() {

    visitorList.innerHTML =
        '<div class="loading">Loading BLUB visitors...</div>';

    const {
        data,
        error
    } =
        await supabaseClient
            .from("visitors")
            .select(
                "id, display_name, created_at, banned"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (error) {
        console.error(error);

        visitorList.innerHTML =
            '<div class="empty">Could not load visitors.</div>';

        return;
    }

    if (!data || data.length === 0) {
        visitorList.innerHTML =
            '<div class="empty">No BLUB visitors yet.</div>';

        updateStats([]);

        return;
    }

    updateStats(data);
    visitorList.innerHTML = "";

    data.forEach(visitor => {

        const card =
            document.createElement("div");

        card.className =
            "visitor";

        const info =
            document.createElement("div");

        info.className =
            "visitor-info";

        const name =
            document.createElement("div");

        name.className =
            "visitor-name";

        name.textContent =
            visitor.display_name ||
            "Unnamed BLUB";

        const id =
            document.createElement("div");

        id.className =
            "visitor-id";

        id.textContent =
            "ID: " + visitor.id;

        const joined =
            document.createElement("div");

        joined.className =
            "joined";

        joined.textContent =
            "Joined: " +
            new Date(
                visitor.created_at
            ).toLocaleString();

        info.appendChild(name);
        info.appendChild(id);
        info.appendChild(joined);

        if (visitor.banned) {
            const status =
                document.createElement("span");

            status.className =
                "status banned";

            status.textContent =
                "BANNED";

            info.appendChild(status);
        }

        const actions =
            document.createElement("div");

        actions.className =
            "actions";

        const button =
            document.createElement("button");

        if (visitor.banned) {
            button.className =
                "unban-button";

            button.textContent =
                "UNBAN";
        } else {
            button.className =
                "ban-button";

            button.textContent =
                "BAN";
        }

        button.addEventListener(
            "click",
            () =>
                setBan(
                    visitor.id,
                    !visitor.banned
                )
        );

        actions.appendChild(button);
        card.appendChild(info);
        card.appendChild(actions);
        visitorList.appendChild(card);
    });
}



function updateStats(visitors) {

    const total =
        visitors.length;

    const banned =
        visitors.filter(
            visitor =>
                visitor.banned
        ).length;

    document.getElementById(
        "totalVisitors"
    ).textContent =
        total;

    document.getElementById(
        "bannedVisitors"
    ).textContent =
        banned;
}



/* ==========================================
   BAN / UNBAN
========================================== */

async function setBan(visitorId, shouldBan) {

    if (!currentAdminName || !currentAdminPassword) {
        alert("Your admin session is missing. Please log in again.");
        return;
    }

    const action =
        shouldBan ? "ban" : "unban";

    if (!confirm(
        `Are you sure you want to ${action} this BLUB?`
    )) {
        return;
    }

    const { data, error } =
        await supabaseClient.rpc(
            "admin_set_visitor_ban",
            {
                p_admin_name: currentAdminName,
                p_admin_password: currentAdminPassword,
                p_visitor_id: visitorId,
                p_should_ban: shouldBan
            }
        );

    if (error) {
        console.error("Ban operation failed:", error);
        alert("Could not update ban status: " + error.message);
        return;
    }

    if (data !== true) {
        alert("The ban operation did not complete.");
        return;
    }

    await loadVisitors();
}



/* ==========================================
   STAFF
========================================== */

async function loadStaff() {

    staffList.innerHTML =
        '<div class="loading">Loading BLUB staff...</div>';

    const {
        data,
        error
    } =
        await supabaseClient
            .from("staff")
            .select(
                "id, name, role, description, display_order"
            )
            .order(
                "display_order",
                {
                    ascending: true
                }
            );

    if (error) {
        console.error(error);

        staffList.innerHTML =
            '<div class="empty">Could not load staff.</div>';

        return;
    }

    if (!data || data.length === 0) {
        staffList.innerHTML =
            '<div class="empty">No staff members yet.</div>';

        return;
    }

    staffList.innerHTML = "";

    data.forEach(member => {

        const card =
            document.createElement("div");

        card.className =
            "staff-member";

        const info =
            document.createElement("div");

        info.className =
            "staff-info";

        const name =
            document.createElement("div");

        name.className =
            "staff-name";

        name.textContent =
            member.name;

        const role =
            document.createElement("div");

        role.className =
            "staff-role";

        role.textContent =
            member.role;

        info.appendChild(name);
        info.appendChild(role);

        if (member.description) {
            const description =
                document.createElement("div");

            description.className =
                "staff-description";

            description.textContent =
                member.description;

            info.appendChild(description);
        }

        const actions =
            document.createElement("div");

        actions.className =
            "actions";

        const edit =
            document.createElement("button");

        edit.className =
            "edit-button";

        edit.textContent =
            "EDIT";

        edit.addEventListener(
            "click",
            () =>
                openEditStaff(member)
        );

        const remove =
            document.createElement("button");

        remove.className =
            "delete-button";

        remove.textContent =
            "DELETE";

        remove.addEventListener(
            "click",
            () =>
                deleteStaff(member.id)
        );

        actions.appendChild(edit);
        actions.appendChild(remove);

        card.appendChild(info);
        card.appendChild(actions);

        staffList.appendChild(card);
    });
}



/* ==========================================
   ADD STAFF
========================================== */

addStaffButton.addEventListener(
    "click",
    () => {

        staffModalTitle.textContent =
            "ADD STAFF MEMBER";

        staffId.value = "";
        staffName.value = "";
        staffRole.value = "";
        staffDescription.value = "";
        staffOrder.value = "1";

        staffFormError.textContent = "";

        staffModal.classList.add(
            "open"
        );

        staffName.focus();
    }
);



/* ==========================================
   EDIT STAFF
========================================== */

function openEditStaff(member) {

    staffModalTitle.textContent =
        "EDIT STAFF MEMBER";

    staffId.value =
        member.id;

    staffName.value =
        member.name || "";

    staffRole.value =
        member.role || "";

    staffDescription.value =
        member.description || "";

    staffOrder.value =
        member.display_order ?? 0;

    staffFormError.textContent = "";

    staffModal.classList.add(
        "open"
    );

    staffName.focus();
}



/* ==========================================
   CLOSE MODAL
========================================== */

cancelStaffButton.addEventListener(
    "click",
    closeStaffModal
);

staffModal.addEventListener(
    "click",
    event => {
        if (event.target === staffModal) {
            closeStaffModal();
        }
    }
);

function closeStaffModal() {
    staffModal.classList.remove(
        "open"
    );
}



/* ==========================================
   SAVE STAFF
========================================== */

saveStaffButton.addEventListener(
    "click",
    saveStaff
);

async function saveStaff() {

    const id =
        staffId.value.trim();

    const name =
        staffName.value.trim();

    const role =
        staffRole.value.trim();

    const description =
        staffDescription.value.trim();

    const displayOrder =
        Number(staffOrder.value);

    staffFormError.textContent = "";

    if (!name) {
        staffFormError.textContent =
            "Enter a staff name.";

        return;
    }

    if (!role) {
        staffFormError.textContent =
            "Enter a staff role.";

        return;
    }

    if (
        !Number.isInteger(displayOrder) ||
        displayOrder < 0
    ) {
        staffFormError.textContent =
            "Display order must be 0 or higher.";

        return;
    }

    saveStaffButton.disabled = true;
    saveStaffButton.textContent = "SAVING...";

    try {
        const staffData = {
            name,
            role,
            description: description || null,
            display_order: displayOrder
        };

        let result;

        if (id) {
            result =
                await supabaseClient
                    .from("staff")
                    .update(staffData)
                    .eq("id", id);
        } else {
            result =
                await supabaseClient
                    .from("staff")
                    .insert(staffData);
        }

        if (result.error) {
            console.error(result.error);

            staffFormError.textContent =
                "Could not save staff member: " + result.error.message;

            return;
        }

        closeStaffModal();
        await loadStaff();

    } catch (error) {
        console.error(error);

        staffFormError.textContent =
            "Unexpected error while saving staff.";
    } finally {
        saveStaffButton.disabled = false;
        saveStaffButton.textContent = "SAVE STAFF";
    }
}



/* ==========================================
   DELETE STAFF
========================================== */

async function deleteStaff(id) {

    if (!confirm(
        "Delete this staff member from BLUB CLUB?"
    )) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("staff")
            .delete()
            .eq("id", id);

    if (error) {
        console.error(error);

        alert(
            "Could not delete staff member: " + error.message
        );

        return;
    }

    await loadStaff();
}



/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
    "click",
    () => {

        // Clear in-memory credentials when the admin logs out.
        currentAdminName = null;
        currentAdminPassword = null;

        adminPanel.style.display =
            "none";

        loginScreen.style.display =
            "flex";

        adminNameInput.value = "";
        adminPasswordInput.value = "";
        loginError.textContent = "";

        adminNameInput.focus();
    }
);

</script>
