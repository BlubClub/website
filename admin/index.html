<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUB CLUB • Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #252525 0%, #0d0d0d 45%, #050505 100%);
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 50px 0;
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 28px;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #bbb;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #d4af37;
            color: #111;
            font-size: 16px;
        }

        .login-button:hover {
            background: #f0cc55;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .admin-panel {
            display: none;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .welcome {
            color: #aaa;
            margin-top: 6px;
        }

        .logout {
            padding: 11px 18px;
            border-radius: 9px;
            background: #252525;
            color: white;
            border: 1px solid #444;
        }

        .logout:hover {
            background: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat {
            background: #151515;
            border: 1px solid #303030;
            border-radius: 15px;
            padding: 22px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #d4af37;
        }

        .stat-label {
            color: #999;
            margin-top: 5px;
        }

        .visitor-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .visitor {
            background: #151515;
            border: 1px solid #303030;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .visitor-info {
            min-width: 0;
            flex: 1;
        }

        .visitor-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .visitor-id {
            color: #777;
            font-size: 12px;
            word-break: break-all;
        }

        .joined {
            color: #888;
            font-size: 13px;
            margin-top: 7px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: rgba(70, 200, 100, 0.15);
            color: #66dd88;
        }

        .banned {
            background: rgba(255, 70, 70, 0.15);
            color: #ff7070;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .ban-button,
        .unban-button {
            padding: 11px 17px;
            border-radius: 9px;
            color: white;
        }

        .ban-button {
            background: #9b2525;
        }

        .ban-button:hover {
            background: #c52f2f;
        }

        .unban-button {
            background: #246b3a;
        }

        .unban-button:hover {
            background: #2f8b4d;
        }

        .loading,
        .empty {
            text-align: center;
            color: #888;
            padding: 50px;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 30px 22px;
            }

            .title {
                font-size: 25px;
            }

            .visitor {
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

            .ban-button,
            .unban-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="logo">🫧</div>

        <h1>BLUB CLUB</h1>

        <div class="subtitle">
            Administrator Access
        </div>

        <label for="adminName">Admin Name</label>

        <input
            id="adminName"
            type="text"
            placeholder="Enter admin name"
            autocomplete="off"
        >

        <label for="adminPassword">Password</label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="off"
        >

        <button class="login-button" id="loginButton">
            ENTER ADMIN PANEL
        </button>

        <div class="error" id="loginError"></div>

    </div>

</div>


<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">

    <div class="container">

        <div class="topbar">

            <div>

                <div class="title">
                    🫧 BLUB CONTROL
                </div>

                <div class="welcome" id="welcomeText"></div>

            </div>

            <button class="logout" id="logoutButton">
                LOG OUT
            </button>

        </div>


        <!-- STATS -->
        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="totalVisitors"
                >
                    0
                </div>

                <div class="stat-label">
                    Total Visitors
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="activeVisitors"
                >
                    0
                </div>

                <div class="stat-label">
                    Active
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="bannedVisitors"
                >
                    0
                </div>

                <div class="stat-label">
                    Banned
                </div>

            </div>

        </div>


        <!-- VISITOR LIST -->
        <div
            id="visitorList"
            class="visitor-list"
        >

            <div class="loading">
                Loading BLUB visitors...
            </div>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
        "https://mkygrpgdsncnenyywtyy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_bI-GRwcfRztZYDeZiBBRNA_3Gmtzwbb";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginScreen =
        document.getElementById("loginScreen");

    const adminPanel =
        document.getElementById("adminPanel");

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const adminNameInput =
        document.getElementById("adminName");

    const adminPasswordInput =
        document.getElementById("adminPassword");

    const loginError =
        document.getElementById("loginError");

    const welcomeText =
        document.getElementById("welcomeText");

    const visitorList =
        document.getElementById("visitorList");


    /* ==========================================
       LOGIN
    ========================================== */

    loginButton.addEventListener(
        "click",
        login
    );


    adminPasswordInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                login();
            }

        }
    );


    async function login() {

        const name =
            adminNameInput.value.trim();

        const password =
            adminPasswordInput.value;

        loginError.textContent = "";


        if (!name || !password) {

            loginError.textContent =
                "Enter both your admin name and password.";

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "CHECKING...";


        const { data, error } =
            await supabaseClient
                .from("blub_admins")
                .select("name")
                .eq("name", name)
                .eq("password", password)
                .maybeSingle();


        if (error) {

            console.error(error);

            loginError.textContent =
                "Could not connect to BLUB security.";

            loginButton.disabled = false;

            loginButton.textContent =
                "ENTER ADMIN PANEL";

            return;
        }


        if (!data) {

            loginError.textContent =
                "Invalid admin name or password.";

            loginButton.disabled = false;

            loginButton.textContent =
                "ENTER ADMIN PANEL";

            return;
        }


        /* SUCCESS */

        adminNameInput.value = "";
        adminPasswordInput.value = "";

        loginScreen.style.display = "none";

        adminPanel.style.display = "block";

        welcomeText.textContent =
            "Logged in as " + data.name;


        await loadVisitors();


        loginButton.disabled = false;

        loginButton.textContent =
            "ENTER ADMIN PANEL";

    }


    /* ==========================================
       LOAD VISITORS
    ========================================== */

    async function loadVisitors() {

        visitorList.innerHTML =
            '<div class="loading">Loading BLUB visitors...</div>';


        const { data, error } =
            await supabaseClient
                .from("visitors")
                .select(
                    "id, display_name, created_at, banned"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(error);

            visitorList.innerHTML =
                '<div class="empty">Could not load visitors.</div>';

            return;
        }


        if (!data || data.length === 0) {

            visitorList.innerHTML =
                '<div class="empty">No BLUB visitors yet.</div>';

            updateStats([]);

            return;
        }


        updateStats(data);


        visitorList.innerHTML = "";


        data.forEach(visitor => {

            const card =
                document.createElement("div");

            card.className = "visitor";


            const visitorInfo =
                document.createElement("div");

            visitorInfo.className =
                "visitor-info";


            const name =
                document.createElement("div");

            name.className =
                "visitor-name";

            name.textContent =
                visitor.display_name ||
                "Unnamed BLUB";


            const id =
                document.createElement("div");

            id.className =
                "visitor-id";

            id.textContent =
                "ID: " + visitor.id;


            const joined =
                document.createElement("div");

            joined.className =
                "joined";

            joined.textContent =
                "Joined: " +
                new Date(
                    visitor.created_at
                ).toLocaleString();


            const status =
                document.createElement("span");

            status.className =
                "status " +
                (
                    visitor.banned
                        ? "banned"
                        : "active"
                );

            status.textContent =
                visitor.banned
                    ? "BANNED"
                    : "ACTIVE";


            visitorInfo.appendChild(name);

            visitorInfo.appendChild(id);

            visitorInfo.appendChild(joined);

            visitorInfo.appendChild(status);


            const actions =
                document.createElement("div");

            actions.className =
                "actions";


            const button =
                document.createElement("button");


            if (visitor.banned) {

                button.className =
                    "unban-button";

                button.textContent =
                    "UNBAN";

            } else {

                button.className =
                    "ban-button";

                button.textContent =
                    "BAN";

            }


            button.addEventListener(
                "click",
                () => setBan(
                    visitor.id,
                    !visitor.banned
                )
            );


            actions.appendChild(button);

            card.appendChild(visitorInfo);

            card.appendChild(actions);

            visitorList.appendChild(card);

        });

    }


    /* ==========================================
       STATS
    ========================================== */

    function updateStats(visitors) {

        const total =
            visitors.length;


        const banned =
            visitors.filter(
                visitor => visitor.banned
            ).length;


        const active =
            total - banned;


        document.getElementById(
            "totalVisitors"
        ).textContent = total;


        document.getElementById(
            "activeVisitors"
        ).textContent = active;


        document.getElementById(
            "bannedVisitors"
        ).textContent = banned;

    }


    /* ==========================================
       BAN / UNBAN
    ========================================== */

    async function setBan(
        visitorId,
        shouldBan
    ) {

        const action =
            shouldBan
                ? "ban"
                : "unban";


        const confirmed =
            confirm(
                `Are you sure you want to ${action} this BLUB?`
            );


        if (!confirmed) {
            return;
        }


        const { error } =
            await supabaseClient
                .from("visitors")
                .update({
                    banned: shouldBan
                })
                .eq("id", visitorId);


        if (error) {

            console.error(error);

            alert(
                "Could not update ban status."
            );

            return;
        }


        await loadVisitors();

    }


    /* ==========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(
        "click",
        function() {

            adminPanel.style.display =
                "none";

            loginScreen.style.display =
                "flex";


            adminNameInput.value = "";

            adminPasswordInput.value = "";

            loginError.textContent = "";


            adminNameInput.focus();

        }
    );

</script>

</body>
</html>
