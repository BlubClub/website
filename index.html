<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="images/logo.jpg">
    <title>BLUB CLUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #030303;
            --text-main: #ffffff;
            --text-muted: #8a8a8a;
            --gold: #d4af37;
            --glass-bg: rgba(25, 25, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-glow: rgba(255, 255, 255, 0.02);
            --nav-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: auto;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        #mural {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at center, #181818 0%, #000000 100%);
        }

        .mural-img {
            position: absolute;
            opacity: 0.25;
            filter: grayscale(0%) blur(2px);
            object-fit: contain;
            mix-blend-mode: screen;
        }

        .m1 { top: -5%; left: -5%; width: 40vw; transform: rotate(-15deg); opacity: 0.30; }
        .m2 { bottom: 10%; right: -10%; width: 45vw; transform: rotate(10deg); opacity: 0.30; }
        .m3 { top: 40%; left: 30%; width: 30vw; opacity: 0.20; filter: blur(2px); }
        .m4 { top: 20%; right: 10%; width: 25vw; transform: rotate(25deg); opacity: 0.28; }
        .m5 { bottom: -5%; left: 15%; width: 35vw; transform: rotate(-5deg); opacity: 0.30; }
        .m6 { top: 60%; right: 25%; width: 28vw; transform: rotate(-12deg); opacity: 0.22; }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 100;
            transition: background 0.4s ease, backdrop-filter 0.4s ease, border-bottom 0.4s ease;
            border-bottom: 1px solid transparent;
        }

        nav.scrolled { background: rgba(3,3,3,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); }

        .nav-logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 0.3em; text-decoration: none; color: var(--text-main); }

        .nav-links { display: flex; gap: 2.5rem; align-items: center; }
        .nav-links a, .nav-links .games-toggle { color: var(--text-main); text-decoration: none; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.2em; transition: color 0.3s ease; }
        .nav-links a:hover, .nav-links .games-toggle:hover { color: var(--text-muted); }

        /* Games dropdown */
        .nav-item.dropdown { position: relative; }
        .dropdown-menu {
            position: absolute;
            right: 0;
            top: calc(var(--nav-height) + 8px);
            background: rgba(10,10,10,0.95);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 6px 10px;
            display: none;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 200;
        }
        .dropdown-menu a { display: block; padding: 10px 12px; color: var(--text-main); text-decoration: none; font-weight: 600; letter-spacing: 0.08em; }
        .dropdown-menu a:hover { background: rgba(255,255,255,0.02); color: var(--text-muted); }
        .nav-item.dropdown.open .dropdown-menu { display: block; }

        .hero { min-height: 100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding-top: var(--nav-height); position: relative; }
        .hero h1 { font-size: clamp(3rem,8vw,7rem); font-weight:200; letter-spacing:0.3em; margin-bottom:1rem; text-indent:0.3em; }
        .hero-subtitle { font-size:1rem; font-weight:400; letter-spacing:0.4em; color:var(--text-muted); margin-bottom:4rem; }

        /* ... (existing styles unchanged) ... */

        .staff-section { padding: 6rem 5% 10rem; text-align:center; max-width:1200px; margin:0 auto; }
        .staff-title { font-size:1.2rem; font-weight:300; letter-spacing:0.5em; color:var(--text-muted); margin-bottom:4rem; }
        .staff-grid { display:flex; justify-content:center; gap:2.5rem; flex-wrap:wrap; }
        .staff-card { background: linear-gradient(145deg, rgba(25,25,25,0.6) 0%, rgba(10,10,10,0.8) 100%); border:1px solid var(--glass-border); border-radius:20px; padding:3.5rem 2rem; flex:1 1 300px; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.5); transition: transform 0.5s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.5s ease; }
        .staff-card h4 { font-size:1.8rem; font-weight:600; letter-spacing:0.1em; margin-bottom:0.5rem; color:var(--gold); }
        .staff-card p.role { font-size:1.1rem; color:var(--text-main); font-weight:300; }

        /* Members carousel styles */
        #members { padding: 4rem 5%; max-width:1200px; margin: 0 auto 6rem; }
        .members-carousel { display:flex; align-items:center; justify-content:center; gap:1rem; }
        .carousel-viewport { width: min(760px, 80%); max-width: 900px; min-height: 220px; display:flex; align-items:center; justify-content:center; }
        .carousel-viewport .staff-card { max-width: 720px; width: 100%; margin: 0; }
        .carousel-arrow { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); padding: 0.8rem 1rem; border-radius:10px; cursor:pointer; font-size:1.2rem; }
        .carousel-arrow:hover { background: rgba(255,255,255,0.02); }

        /* small screens */
        @media (max-width: 768px) {
            .nav-links { display:none; }
            .carousel-viewport { width: 100%; }
            .carousel-arrow { padding: 0.6rem 0.8rem; }
        }

    </style>
</head>

<body>

<div id="mural">

    <img src="images/Gemini_Generated_Image_fjjc9yfjjc9yfjjc.jpeg" class="mural-img m1" alt="">
    <img src="images/Blub.png" class="mural-img m2" alt="">
    <img src="images/Gemini_Generated_Image_ppp6x0ppp6x0ppp6.jpeg" class="mural-img m3" alt="">
    <img src="images/Gemini_Generated_Image_3ry3w73ry3w73ry3.jpeg" class="mural-img m4" alt="">
    <img src="images/Gemini_Generated_Image_upqumcupqumcupqu.jpeg" class="mural-img m5" alt="">
    <img src="images/volcano-blub.png" class="mural-img m6" alt="">

</div>


<nav id="navbar">

    <a href="#home" class="nav-logo">BLUB CLUB</a>

    <div class="nav-links">

        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#blubs">BLUBS</a>
        <a href="#the-king">THE KING</a>

        <div class="nav-item dropdown" id="gamesDropdown">
            <a href="#" class="games-toggle">GAMES ▾</a>
            <div class="dropdown-menu" role="menu">
                <a href="/website/game/">Game</a>
                <a href="/website/goofygame/">GoofyGame</a>
                <a href="/website/bettergame/">BetterGame (Recommended)</a>
            </div>
        </div>

        <a href="admin/">ADMIN</a>

    </div>

</nav>


<header id="home" class="hero">

    <h1 class="fade-in">BLUB CLUB</h1>

    <p class="hero-subtitle fade-in" style="transition-delay: 0.1s;">THE HOME OF THE BLUBS</p>

    <div class="hero-img-container">
        <img src="images/Gemini_Generated_Image_fjjc9yfjjc9yfjjc.jpeg" alt="King Cheesecake Blub" class="hero-img">
    </div>

    <p class="hero-label fade-in" style="transition-delay: 0.8s;">KING CHEESECAKE BLUB</p>

</header>


<section id="about" class="about-wrapper">

    <div class="scroll-track">
        <div class="sticky-content">
            <div class="text-container">
                <h2 id="animated-text" class="scroll-text"></h2>
            </div>
        </div>
    </div>

    <div class="staff-section">

        <h3 class="staff-title fade-in">THE BLUB CLUB STAFF</h3>

        <!-- SUPABASE STAFF GOES HERE -->
        <div id="staff-grid" class="staff-grid">
            <div class="staff-card fade-in">
                <h4>LOADING...</h4>
                <p class="role">BLUB STAFF</p>
            </div>
        </div>

    </div>

</section>

<!-- New members carousel: will be populated from existing staff cards that match Honorary/Regular members -->
<section id="members">
    <h2 class="section-title fade-in">MEMBERS</h2>
    <div class="members-carousel">
        <button class="carousel-arrow left" id="carouselPrev" aria-label="Previous">◀</button>
        <div class="carousel-viewport" id="carouselViewport" aria-live="polite"></div>
        <button class="carousel-arrow right" id="carouselNext" aria-label="Next">▶</button>
    </div>
</section>


<section id="blubs" class="collection">

    <h2 class="section-title fade-in">MEET THE BLUBS</h2>

    <div class="grid">
        <!-- existing blub cards unchanged -->

        <div class="card fade-in">
            <div class="card-img-wrapper">
                <img src="images/Blub.png" alt="OG Blub" loading="lazy">
            </div>
            <div>
                <h3>OG BLUB</h3>
                <p>The original Blub.</p>
            </div>
        </div>

        <!-- ... many existing cards omitted for brevity (kept unchanged) ... -->

    </div>

</section>


<footer>
    <h2>JOIN THE BLUBS</h2>
    <p class="copyright">© Blub Club</p>
</footer>


<script>
// Dropdown behavior
(function(){
    const dropdown = document.getElementById('gamesDropdown');
    if (!dropdown) return;
    const toggle = dropdown.querySelector('.games-toggle');
    toggle.addEventListener('click', function(e){
        e.preventDefault();
        dropdown.classList.toggle('open');
    });
    // close on outside click
    document.addEventListener('click', function(e){
        if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
    });
})();

// Staff/Member rearrange + carousel
(function(){
    const staffGrid = document.getElementById('staff-grid');
    const carouselViewport = document.getElementById('carouselViewport');
    const prevBtn = document.getElementById('carouselPrev');
    const nextBtn = document.getElementById('carouselNext');
    let slides = [];
    let current = 0;

    function swapNames(nameA, nameB){
        if(!staffGrid) return;
        const cards = Array.from(staffGrid.querySelectorAll('.staff-card'));
        const cardA = cards.find(c => (c.querySelector('h4') && c.querySelector('h4').innerText.trim() === nameA));
        const cardB = cards.find(c => (c.querySelector('h4') && c.querySelector('h4').innerText.trim() === nameB));
        if(cardA && cardB && cardA.parentNode === staffGrid && cardB.parentNode === staffGrid){
            // swap positions
            const refA = cardA.nextSibling === cardB ? cardA : cardA.nextSibling;
            staffGrid.insertBefore(cardB, cardA);
            staffGrid.insertBefore(cardA, refA);
        }
    }

    function collectMemberCards(){
        if(!staffGrid) return [];
        const all = Array.from(staffGrid.querySelectorAll('.staff-card'));
        // identify members by role text: honorary / regular / member but exclude premium
        const members = all.filter(card => {
            const role = (card.querySelector('.role') || card.querySelector('p')).innerText || '';
            const isPremium = /premium/i.test(role);
            const isMember = /honorary|honor|regular|member/i.test(role);
            return isMember && !isPremium;
        });
        return members;
    }

    function buildCarouselFromCards(cards){
        if(!carouselViewport) return;
        carouselViewport.innerHTML = '';
        slides = [];
        cards.forEach((card, idx) => {
            // move node into carousel (keep original node)
            const slideWrapper = document.createElement('div');
            slideWrapper.className = 'carousel-slide';
            // make sure slide uses staff-card styles
            slideWrapper.appendChild(card);
            carouselViewport.appendChild(slideWrapper);
            slides.push(slideWrapper);
        });
        if(slides.length === 0) {
            carouselViewport.innerHTML = '<div style="color:var(--text-muted);">No Honorary/Regular members found.</div>';
        }
        showSlide(0);
    }

    function showSlide(i){
        if(slides.length === 0) return;
        current = (i + slides.length) % slides.length;
        slides.forEach((s, idx) => {
            s.style.display = idx === current ? 'block' : 'none';
        });
    }

    prevBtn && prevBtn.addEventListener('click', function(){ showSlide(current - 1); });
    nextBtn && nextBtn.addEventListener('click', function(){ showSlide(current + 1); });

    // Wait for staff cards to appear (in case Supabase fills them asynchronously).
    function processOnce(){
        // swap requested names
        swapNames('Akshath', 'Adam Snyder');

        const members = collectMemberCards();
        if(members.length > 0){
            // move found member cards into carousel
            buildCarouselFromCards(members);
            return true;
        }
        return false;
    }

    // MutationObserver to watch staffGrid
    if(staffGrid){
        const observer = new MutationObserver((mutations, obs) => {
            if(processOnce()) obs.disconnect();
        });
        observer.observe(staffGrid, { childList: true, subtree: true });
        // fallback attempt after 2s
        setTimeout(() => { processOnce(); }, 2000);
    }

})();

</script>

</body>
</html>
